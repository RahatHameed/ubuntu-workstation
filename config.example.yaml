# Ubuntu Setup Scripts Configuration
# Copy this file to config.yaml and customize

# ============================================
# Modules to install (true/false)
# ============================================
modules:
  shell: true        # Zsh + Oh My Zsh
  git: true          # Git configuration + aliases
  ssh: true          # SSH key + agent setup
  apps: true         # Work applications
  docker: true       # Docker Engine + Desktop
  desktop: true      # Plank dock, GNOME tweaks
  vpn: true          # VPN client

# ============================================
# Applications to install
# Comment out apps you don't need
# ============================================
apps:
  - build-tools
  - chrome
  - slack
  - teams
  - jetbrains-toolbox
  # - vscode
  # - discord
  # - zoom
  # - postman
  # Optional (uncomment to install):
  # - spotify
  # - dbeaver
  # - tigervnc

# ============================================
# Desktop settings
# ============================================
# Install WhiteSur macOS-style theme automatically
install_theme: false

# Font scaling factor (1.0 = normal, 1.25 = larger)
font_scale: 1.25

# ============================================
# Startup applications
# Apps to launch on login (used by startup-office.sh)
# ============================================
startup_apps:
  - phpstorm
  - slack
  - google-chrome
  - plank
  - docker-desktop
  - gnome-terminal

# ============================================
# VPN Configuration
# ============================================
vpn:
  # Provider: mullvad, nordvpn, protonvpn
  provider: nordvpn

  # Default country for VPN connection
  default_country: Germany

  # Default city (optional, for consistent IP location)
  # NordVPN: Frankfurt, Berlin, Hamburg
  default_city: Frankfurt

  # Auto-connect on startup
  auto_connect: false

  # Disable IPv6 to prevent VPN leaks (recommended: true)
  # When enabled, IPv6 is disabled system-wide so your real IP won't leak
  ipv6_disable: true

  # Account credentials (provider-specific)
  # Mullvad: account number (16 digits)
  # NordVPN: leave empty (uses browser login)
  # ProtonVPN: leave empty (uses browser login)
  account_number: ""

# ============================================
# Optional tools
# ============================================
# Install Claude CLI
install_claude: false
